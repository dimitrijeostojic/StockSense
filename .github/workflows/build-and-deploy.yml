name: Stock Sense CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  
env:
 AZURE_WEBAPP_NAME: stock-sense-api
 AZURE_WEBAPP_PACKAGE_PATH: ${{ github.workspace }}/publish
 DOTNET_VERSION: '10.0.x'
 SOLUTION_PATH: './StockSense.slnx'
 API_PROJECT_PATH: './StockSense.API/StockSense.API.csproj'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore --no-build --property:PublishDir=${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} 

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Generate migration scripts
        run: |
          dotnet ef migrations script --idempotent \
            --project Infrastructure --startup-project StockSense.API \
            --context ApplicationDbContext \
            --output ${{ github.workspace }}/sql/app.sql
          dotnet ef migrations script --idempotent \
            --project Infrastructure --startup-project StockSense.API \
            --context AuthDbContext \
            --output ${{ github.workspace }}/sql/auth.sql

      - name: Upload SQL scripts
        uses: actions/upload-artifact@v4
        with:
          name: sql
          path: ${{ github.workspace }}/sql 

  migrate:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sql
          path: sql

      - name: Apply migrations
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
          path: ./sql/app.sql

      - name: Apply auth migrations
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.AUTH_CONNECTION_STRING }}
          path: ./sql/auth.sql

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: dev
    
    steps:
     - name: Download artifacts from build job
       uses: actions/download-artifact@v4
       with:
         name: webapp
         path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
     - name: Deploy
       uses: azure/webapps-deploy@v3
       with:
         app-name: ${{ env.AZURE_WEBAPP_NAME }}
         publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
         package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}